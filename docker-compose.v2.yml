services:
  postgres_v2:
    image: pgvector/pgvector:pg16
    container_name: open-brain-v2-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: open_brain_v2
    ports:
      - "5433:5432"
    volumes:
      - open_brain_v2_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_brain_v2"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  open_brain_v2_data:
